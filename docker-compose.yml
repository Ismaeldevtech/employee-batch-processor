services:
  postgres:
    image: postgres:16
    container_name: employee-batch-db
    environment:
      POSTGRES_DB: employeedb
      POSTGRES_USER: batchuser
      POSTGRES_PASSWORD: batchpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: